default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: lake-reality
        name: lake reality for changed dataset YAML
        entry: scripts/ci/lake_reality_precommit.sh
        language: system
        pass_filenames: false
        files: ^etl/datasets/.*\.yml$
      - id: compliance-pack
        name: compliance pack public-release gate
        entry: uv run python scripts/check_compliance_pack.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: public-privacy
        name: public API privacy gate
        entry: uv run python scripts/check_public_privacy.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: open-core-boundary
        name: open-core boundary gate
        entry: uv run python scripts/check_open_core_boundary.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: repo-publish-audit
        name: repository public-readiness audit
        entry: uv run python scripts/repo_publish_audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
