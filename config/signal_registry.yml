    public_safe: false
    requires_identity: [EXACT_COMPANY_NIT, EXACT_PERSON_DOCUMENT]
    sources:
      [
        secop_contract_modifications,
        secop_contract_suspensions,
        secop_contract_execution,
        secop_guarantees,
        secop_cdp_requests,
        secop_budget_commitments,
        secop_budget_items,
        secop_invoices,
        secop_payment_plans,
        secop_ii_contracts,
      ]
    sources_required:
      [
        secop_contract_modifications,
        secop_contract_suspensions,
        secop_contract_execution,
        secop_ii_contracts,
      ]
    scope_type: contract_modification_ladder
    dedup_fields: [scope_key]
    runner:
      kind: duckdb
      ref: procurement_contract_modification_ladder_review_only
    public_policy:
      allow_public: false
      require_public_evidence: true
      require_exact_identity: true
      allowed_identity_match_types: [EXACT_COMPANY_NIT, EXACT_PERSON_DOCUMENT]
      allow_person_entities: true
    evidence_mapping:
      item_type: evidence_reference
      node_ref_field: node_ref
    caveats:
      - Repeated SECOP modifications and support-signal convergence do not prove illegal modifications, unlawful avoidance of competition, fiscal harm, delivery failure, or corrupt intent without source-file and legal review.
    dedup_key_template: signal:{id}:entity:{entity_key}:scope:{scope_key}

