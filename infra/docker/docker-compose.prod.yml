name: co-acc

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - coacc
    depends_on:
      - api
      - frontend

  api:
    build: ../../api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      NEO4J_ENABLED: "false"
      NEO4J_REQUIRED: "false"
      COACC_CONFIG_DIR: /app/config
      COACC_DATASET_CATALOG_DIR: /app/docs/datasets
      COACC_DATASET_CONTRACT_DIR: /app/etl/datasets
      COACC_SOURCE_REGISTRY_PATH: /app/docs/datasets/catalog.signed.csv
      COACC_LAKE_ROOT: /app/lake
      COACC_REQUIRE_LAKE_ASSETS: "true"
      COACC_READY_MIN_LOADED_SOURCES: ${COACC_READY_MIN_LOADED_SOURCES:-1}
      COACC_READY_MAX_LAKE_OPS_AGE_HOURS: ${COACC_READY_MAX_LAKE_OPS_AGE_HOURS:-48}
      COACC_SIGNALS_REQUIRE_MATERIALIZED: "false"
      PUBLIC_MODE: "true"
      PUBLIC_ALLOW_ENTITY_LOOKUP: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      INVITE_CODE: ${INVITE_CODE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:?DOMAIN is required}}
      AUTH_COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${COACC_HOST_CONFIG_DIR:-../../config}:/app/config:ro
      - ${COACC_HOST_DATASET_CATALOG_DIR:-../../docs/datasets}:/app/docs/datasets:ro
      - ${COACC_HOST_DATASET_CONTRACT_DIR:-../../etl/datasets}:/app/etl/datasets:ro
      - ${COACC_HOST_LAKE_ROOT:-../../lake}:/app/lake:ro
    networks:
      - coacc
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build: ../../frontend
    restart: unless-stopped
    networks:
      - coacc
    depends_on:
      - api

  lake-ops:
    build: ../../etl
    profiles:
      - ops
    working_dir: /workspace
    environment:
      COACC_LAKE_ROOT: /workspace/lake
      COACC_CONFIG_DIR: /workspace/config
      COACC_DATASET_CATALOG_DIR: /workspace/docs/datasets
      COACC_DATASET_CONTRACT_DIR: /workspace/etl/datasets
      COACC_RUNBOOK_DIR: /workspace/lake/meta/operations
      COACC_SOCRATA_PAGE_SIZE: ${COACC_SOCRATA_PAGE_SIZE:-10000}
      COACC_SOCRATA_MAX_PAGES: ${COACC_SOCRATA_MAX_PAGES:-10000}
      COACC_SOCRATA_TIMEOUT_SECONDS: ${COACC_SOCRATA_TIMEOUT_SECONDS:-60}
      COACC_SOCRATA_MAX_TIMEOUT_SECONDS: ${COACC_SOCRATA_MAX_TIMEOUT_SECONDS:-240}
      COACC_WATERMARK_FUTURE_GRACE_DAYS: ${COACC_WATERMARK_FUTURE_GRACE_DAYS:-1}
      COACC_LAKE_OPS_MODE: ${COACC_LAKE_OPS_MODE:-refresh}
      COACC_LAKE_OPS_RUN_ID_PREFIX: ${COACC_LAKE_OPS_RUN_ID_PREFIX:-prod}
      COACC_LAKE_OPS_CONTINUE_ON_ERROR: ${COACC_LAKE_OPS_CONTINUE_ON_ERROR:-true}
      COACC_LAKE_OPS_ALLOW_FULL: ${COACC_LAKE_OPS_ALLOW_FULL:-false}
      COACC_LAKE_OPS_SKIP_REALITY: ${COACC_LAKE_OPS_SKIP_REALITY:-false}
      COACC_LAKE_OPS_PAGE_SIZE: ${COACC_LAKE_OPS_PAGE_SIZE:-}
      COACC_LAKE_OPS_MAX_PAGES: ${COACC_LAKE_OPS_MAX_PAGES:-}
      COACC_LAKE_OPS_TIMEOUT_SECONDS: ${COACC_LAKE_OPS_TIMEOUT_SECONDS:-}
      COACC_LAKE_OPS_MIN_FREE_GB: ${COACC_LAKE_OPS_MIN_FREE_GB:-}
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
      SOCRATA_KEY_ID: ${SOCRATA_KEY_ID:-}
      SOCRATA_KEY_SECRET: ${SOCRATA_KEY_SECRET:-}
    volumes:
      - ${COACC_HOST_LAKE_ROOT:-../../lake}:/workspace/lake
      - ${COACC_HOST_CONFIG_DIR:-../../config}:/workspace/config:ro
      - ${COACC_HOST_DATASET_CATALOG_DIR:-../../docs/datasets}:/workspace/docs/datasets:ro
      - ${COACC_HOST_DATASET_CONTRACT_DIR:-../../etl/datasets}:/workspace/etl/datasets:ro
      - ../../scripts:/workspace/scripts:ro
      - ../scripts:/workspace/infra/scripts:ro
    networks:
      - coacc
    entrypoint: ["bash", "/workspace/infra/scripts/lake-ops-entrypoint.sh"]
    command: ["refresh"]

networks:
  coacc:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
